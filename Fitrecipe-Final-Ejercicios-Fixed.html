}

function closeMealModal(){ document.getElementById('mealModalOverlay').classList.remove('show'); }
function closeExerciseModal(){ document.getElementById('exerciseModalOverlay').classList.remove('show'); }

window.showMeal = function(meal){
  ensureModals();
  if(!meal) return;
  document.getElementById('mealModalImg').src = meal.img || meal.image || '';
  document.getElementById('mealModalName').textContent = meal.name || '';
  document.getElementById('mealModalKcal').textContent = (meal.kcal || meal.calories || '') + ' KCAL • ' + (meal.time || '');
  document.getElementById('mealModalProtein').textContent = meal.protein || (meal.proteinas ? meal.proteinas + ' proteína' : '') || (meal.protein ? meal.protein + 'g proteína' : '');
  
  const ingUl = document.getElementById('mealModalIngredients');
  ingUl.innerHTML = '';
  (meal.ingredients || []).forEach(ing => {
    const li = document.createElement('li');
    li.style.cssText = 'color:rgba(255,255,255,0.8);font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:8px;';
    li.innerHTML = '<span style="color:#22c55e;">•</span> ' + ing;
    ingUl.appendChild(li);
  });
  
  const prepOl = document.getElementById('mealModalPrep');
  prepOl.innerHTML = '';
  const steps = meal.preparation || meal.preparacion || ['Mezcla todos los ingredientes', 'Cocina según indicaciones', 'Sirve y disfruta'];
  steps.forEach(step => {
    const li = document.createElement('li');
    li.style.marginBottom = '8px';
    li.textContent = step;
    prepOl.appendChild(li);
  });
  
  const nut = document.getElementById('mealModalNutrition');
  nut.innerHTML = `
    <div style="text-align:center;"><p style="color:white;font-weight:bold;">${meal.kcal || ''}</p><p style="color:rgba(255,255,255,0.4);font-size:10px;">KCAL</p></div>
    <div style="text-align:center;"><p style="color:white;font-weight:bold;">${meal.protein || meal.proteinas || ''}</p><p style="color:rgba(255,255,255,0.4);font-size:10px;">PROTEÍNA</p></div>
    <div style="text-align:center;"><p style="color:white;font-weight:bold;">${meal.carbs || ''}</p><p style="color:rgba(255,255,255,0.4);font-size:10px;">CARBS</p></div>
  `;
  
  document.getElementById('mealModalOverlay').classList.add('show');
};


window.showExercise = function(ex){
  ensureModals();
  if(!ex) return;
  document.getElementById('exModalImg').src = ex.img || ex.image || '';
  document.getElementById('exModalName').textContent = ex.name || '';
  document.getElementById('exModalTime').textContent = (ex.time || ex.tiempo || '') + ' • ' + (ex.focus || ex.musculo || '');
  document.getElementById('exModalFocus').textContent = ex.focus || '';
  // Genera guía detallada con parámetros
  const sets = ex.time || '';
  let duracion = '5-10 minutos';
  let repeticiones = sets;
  if(sets.includes('x')) {
    const parts = sets.split('x');
    if(parts[0] && parts[1]) {
      duracion = parts[0] + ' series de ' + parts[1] + ' repeticiones - 5 minutos aprox';
      repeticiones = parts[1] + ' repeticiones x ' + parts[0] + ' series';
    }
  } else if(sets.includes('s')) {
    duracion = sets + ' por serie - 5 minutos';
  }
  document.getElementById('exModalGuide').innerHTML = `
    <strong>Cómo hacerlo:</strong><br/>
    1. Posición inicial: ${ex.focus || 'Piernas separadas ancho hombros'}<br/>
    2. Ejecuta: ${ex.name || ''} - ${sets}<br/>
    3. Respiración: exhala al esfuerzo, inhala al volver<br/>
    4. Descanso: 30-45 segundos entre series<br/>
    5. Errores comunes: no arquear espalda, mantener core activo<br/><br/>
    <strong>Músculos:</strong> ${ex.focus || ''}<br/>
    <strong>Sin material:</strong> Solo peso corporal
  `;
  document.getElementById('exModalDuration').textContent = duracion;
  document.getElementById('exModalSets').textContent = repeticiones;
  document.getElementById('exerciseModalOverlay').classList.add('show');
};


document.addEventListener('DOMContentLoaded', ensureModals);
ensureModals();
</script>

<script>
// Attach click listeners to exercise cards via event delegation
document.addEventListener('click', function(e){
  const card = e.target.closest('[class*="bg-[#1a1a1a]"]');
  if(!card) return;
  // Check if we're in ejercicios tab by looking at page content
  const isExerciseCard = card.textContent.includes('x15') || card.textContent.includes('x12') || card.textContent.includes('x20') || card.textContent.includes('Mujer •') || card.textContent.includes('Piernas y glúteos') || card.textContent.includes('Core y abdomen');
  if(isExerciseCard && card.querySelector('img')) {
    // Try to find exercise data from global or from card
    const img = card.querySelector('img');
    const nameEl = card.querySelector('p.font-bold');
    const timeEl = card.querySelector('p.text-\[10px\]') || card.textContent.match(/\d+x\d+/);
    if(nameEl) {
      const exData = {
        name: nameEl.textContent,
        img: img ? img.src : '',
        time: timeEl ? (timeEl.textContent || timeEl[0] || '') : '',
        focus: card.textContent,
        exerciseDesc: 'Realiza el ejercicio con buena técnica. ' + (card.textContent || '')
      };
      if(window.showExercise) window.showExercise(exData);
    }
  }
}, true);
</script>
